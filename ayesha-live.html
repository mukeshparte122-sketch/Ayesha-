<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><title>AYESHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#14171f;--mu:#6b7280;--br:#e5e7eb;--pr:#ea580c;--ok:#15803d;--bad:#b91c1c;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--cd:#171b22;--tx:#eef0f4;--mu:#9aa3b2;--br:#2a303b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Noto Sans Devanagari",sans-serif;max-width:560px;margin:auto;padding-bottom:80px}
header{position:sticky;top:0;background:var(--cd);border-bottom:1px solid var(--br);padding:10px 14px;display:flex;align-items:center;gap:8px;z-index:5}
header b{color:var(--pr);font-size:20px;letter-spacing:1px}header small{display:block;color:var(--mu);font-size:11px}
main{padding:12px}.c{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit;margin:3px 0 8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;font-weight:600}button.s{background:#fff3ea;color:var(--pr)}button.g{background:var(--ok)}button.r{background:var(--bad)}
label{font-size:12px;color:var(--mu)}.r2{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:#fff3ea;color:var(--pr);font-weight:700}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--cd);border-top:1px solid var(--br);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:12px;padding:10px 2px}nav button.on{color:var(--pr)}
</style></head><body>
<header><div><b>AYESHA</b><small>खरीदना नहीं, ज़रूरत के हिसाब से रेंट करो।</small></div><button class="s" id="out" style="margin-left:auto;display:none;padding:6px 10px" onclick="sb.auth.signOut()">Logout</button></header>
<main id="app">लोड हो रहा है…</main><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://oaooqavdyordtoulklcr.supabase.co",SB_KEY="sb_publishable_fuQIiXvbj5G43KJt6PpnSw_-qbCJHk4";
const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS=["Construction","Welding","Ladders","DJ/Event","Farming"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
let me=null,tab="",q="",pct=10;
const TABS={customer:[["home","🏠 खोजें"],["mine","📋 बुकिंग"]],owner:[["items","📦 मेरे आइटम"],["add","➕ जोड़ें"],["reqs","🔔 अनुरोध"]],admin:[["appr","✅ अनुमोदन"],["all","📊 बुकिंग"]]};
const msg=(e)=>{if(e){alert("गड़बड़: "+e.message);return true}};
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){me=null;return authView()}
 let{data}=await sb.from("profiles").select("*").eq("id",session.user.id).single();me=data;if(!me){$("#app").innerHTML=`<div class="c">प्रोफ़ाइल नहीं मिली। कृपया सपोर्ट से संपर्क करें।</div>`;return}
 const s=await sb.from("settings").select("value").eq("key","commission_pct").single();if(s.data)pct=+s.data.value;
 $("#out").style.display="block";tab=TABS[me.role][0][0];draw()}
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"||ev==="SIGNED_OUT")boot()});
function authView(){$("#out").style.display="none";$("#nav").innerHTML="";$("#app").innerHTML=`<div class="c"><h3>लॉगिन / साइन-अप</h3><label>नाम (साइन-अप के लिए)</label><input id="nm"><label>ईमेल</label><input id="em" type="email"><label>पासवर्ड (कम से कम 6 अक्षर)</label><input id="pw" type="password"><label>मैं हूँ</label><select id="rl"><option value="customer">ग्राहक (किराये पर लेना है)</option><option value="owner">मालिक (सामान किराये पर देना है)</option></select><div class="r2"><button onclick="login()">लॉगिन</button><button class="s" onclick="signup()">नया अकाउंट</button></div></div>`}
async function signup(){const{data,error}=await sb.auth.signUp({email:$("#em").value,password:$("#pw").value,options:{data:{name:$("#nm").value,role:$("#rl").value}}});if(msg(error))return;if(!data.session)alert("अकाउंट बन गया। अगर लॉगिन न हो, तो ईमेल में आया पुष्टि लिंक दबाएँ, फिर लॉगिन करें।")}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});msg(error)}
function draw(){$("#nav").innerHTML=TABS[me.role].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';draw()">${l}</button>`).join("");$("#app").innerHTML="लोड हो रहा है…";V[tab]()}
const V={
async home(){let r=await sb.from("items").select("*").eq("status","approved").order("created_at",{ascending:false});if(msg(r.error))return;const L=r.data.filter(i=>(i.title+i.category+(i.area||"")).toLowerCase().includes(q.toLowerCase()));
 $("#app").innerHTML=`<input id="q" placeholder="औज़ार, सीढ़ी, DJ खोजें…" value="${esc(q)}" onchange="q=this.value;draw()">`+(L.length?L.map(i=>`<div class="c"><div class="r2"><b>${esc(i.title)}</b><span class="tag">${esc(i.category)}</span></div><div class="mu">📍${esc(i.area)}</div><div class="r2"><span><b>${inr(i.price_day)}</b>/दिन · डिपॉज़िट ${inr(i.deposit)}</span><button onclick="bookForm(${i.id})">रेंट करें</button></div><div id="b${i.id}"></div></div>`).join(""):`<p class="mu">अभी कोई आइटम नहीं। मालिक आइटम जोड़ेंगे तो यहाँ दिखेंगे।</p>`)},
async mine(){const r=await sb.from("bookings").select("*,items(title)").eq("renter_id",me.id).order("id",{ascending:false});if(msg(r.error))return;$("#app").innerHTML=r.data.length?r.data.map(b=>`<div class="c"><div class="r2"><b>${esc(b.items?.title)}</b><span class="tag">${b.status}</span></div><div class="mu">${b.start_date} → ${b.end_date} · किराया ${inr(b.rent)} + डिपॉज़िट ${inr(b.deposit)}</div><div class="mu">भुगतान: ${b.payment_status==="paid"?"हो गया":"बाकी (अभी मालिक को UPI से दें)"}</div></div>`).join(""):`<p class="mu">अभी कोई बुकिंग नहीं।</p>`},
async items(){const r=await sb.from("items").select("*").eq("owner_id",me.id);if(msg(r.error))return;$("#app").innerHTML=(r.data.length?r.data.map(i=>`<div class="c r2"><span><b>${esc(i.title)}</b><div class="mu">${inr(i.price_day)}/दिन</div></span><span class="tag">${i.status}</span></div>`).join(""):`<p class="mu">अभी कोई आइटम नहीं। "जोड़ें" दबाएँ।</p>`)+`<div class="mu">KYC स्थिति: ${me.kyc_status}</div>`},
add(){$("#app").innerHTML=`<div class="c"><h3>नया आइटम</h3><label>नाम</label><input id="t"><label>श्रेणी</label><select id="cg">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><label>रोज़ का किराया ₹</label><input id="p" type="number"><label>सिक्योरिटी डिपॉज़िट ₹</label><input id="d" type="number"><label>इलाका</label><input id="a" value="Sriperumbudur"><button onclick="addItem()">अनुमोदन के लिए भेजें</button></div>`},
async reqs(){const r=await sb.from("bookings").select("*,items(title)").eq("owner_id",me.id).order("id",{ascending:false});if(msg(r.error))return;const net=r.data.filter(b=>["accepted","active","returned"].includes(b.status)).reduce((s,b)=>s+b.rent-b.commission,0);
 $("#app").innerHTML=`<div class="c">कुल कमाई (कमीशन के बाद): <b>${inr(net)}</b></div>`+(r.data.length?r.data.map(b=>`<div class="c"><div class="r2"><b>${esc(b.items?.title)}</b><span class="tag">${b.status}</span></div><div class="mu">${b.start_date} → ${b.end_date} · ${inr(b.rent)} (कमीशन ${inr(b.commission)})</div>${b.status==="requested"?`<div class="r2"><button class="g" onclick="setB(${b.id},'accepted')">स्वीकार</button><button class="r" onclick="setB(${b.id},'rejected')">अस्वीकार</button></div>`:""}</div>`).join(""):`<p class="mu">अभी कोई अनुरोध नहीं।</p>`)},
async appr(){const r=await sb.from("items").select("*").eq("status","pending");if(msg(r.error))return;$("#app").innerHTML=r.data.length?r.data.map(i=>`<div class="c r2"><span><b>${esc(i.title)}</b><div class="mu">${inr(i.price_day)}/दिन</div></span><span><button class="g" onclick="setI(${i.id},'approved')">मंज़ूर</button> <button class="r" onclick="setI(${i.id},'rejected')">रद्द</button></span></div>`).join(""):`<p class="mu">कुछ अनुमोदन के लिए बाकी नहीं।</p>`},
async all(){const r=await sb.from("bookings").select("*");if(msg(r.error))return;const c=r.data.reduce((s,b)=>s+ +b.commission,0);$("#app").innerHTML=`<div class="c"><div class="mu">कुल बुकिंग</div><b style="font-size:22px">${r.data.length}</b><div class="mu">कमीशन आय</div><b style="font-size:22px">${inr(c)}</b></div>`}};
function bookForm(id){document.querySelectorAll("[id^=b]").forEach(e=>{if(/^b\d+$/.test(e.id))e.innerHTML=""});$("#b"+id).innerHTML=`<hr><label>शुरू की तारीख</label><input type="date" id="sd" value="${new Date(Date.now()+864e5).toISOString().slice(0,10)}"><label>कितने दिन</label><input type="number" id="dy" value="2" min="1"><button onclick="book(${id})">बुकिंग का अनुरोध भेजें</button><div class="mu">ऑनलाइन पेमेंट जल्द जुड़ेगा। अभी मालिक के स्वीकार करने के बाद उसे UPI से भुगतान करें।</div>`}
async function book(id){const{data:i}=await sb.from("items").select("*").eq("id",id).single(),d=Math.max(1,+$("#dy").value),s=new Date($("#sd").value),e=new Date(s.getTime()+(d-1)*864e5),rent=i.price_day*d;
 const{error}=await sb.from("bookings").insert({item_id:id,renter_id:me.id,owner_id:i.owner_id,start_date:$("#sd").value,end_date:e.toISOString().slice(0,10),rent,deposit:i.deposit,commission:rent*pct/100});if(msg(error))return;tab="mine";draw()}
async function addItem(){const p=+$("#p").value;if(!$("#t").value||!p){alert("नाम और किराया ज़रूरी है");return}const{error}=await sb.from("items").insert({owner_id:me.id,title:$("#t").value,category:$("#cg").value,price_day:p,deposit:+$("#d").value||0,area:$("#a").value});if(msg(error))return;alert("भेज दिया। एडमिन के मंज़ूर करने पर दिखेगा।");tab="items";draw()}
async function setB(id,st){const{error}=await sb.from("bookings").update({status:st}).eq("id",id);if(!msg(error))draw()}
async function setI(id,st){const{error}=await sb.from("items").update({status:st}).eq("id",id);if(!msg(error))draw()}
boot();
</script></body></html>
